name: CI
on:
  pull_request:
  push:
permissions: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
      - name: Install dependencies
        run: npm ci
      - name: Run Build
        run: npm run build
      - name: Run Oxlint
        run: npx oxlint
      - name: Run Prettier
        run: npx prettier . --check
      - name: Run Vitest
        run: npx vitest run