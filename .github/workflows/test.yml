name: autofix.ci
on:
  pull_request:
  push:
permissions: {}
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run
      - uses: autofix-ci/action@v1
        with:
          commit-message: "Apply Prettier format"
